# Site configuration for Material for MkDocs.
# The nav at the bottom is the one place a new page is registered: copy a line and change it.
site_name: DevOps Notes
site_description: General DevOps interview-prep notes. Linux and networking first, then AWS, Kubernetes, delivery and operations.
site_url: https://alfinwilliam.github.io/devops-notes/
repo_url: https://github.com/alfinwilliam/devops-notes
repo_name: alfinwilliam/devops-notes
edit_uri: edit/main/docs/
docs_dir: docs
copyright: 'By <a href="https://alfinwilliam.github.io/">Alfin William</a>. Personal study notes. A page marked "AI draft" has not been verified yet; check it against its sources.'

theme:
  name: material
  font: false
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

extra_css:
  - assets/stylesheets/diagram-zoom.css
  - assets/stylesheets/footer.css

extra_javascript:
  - assets/javascripts/diagram-zoom.js


markdown_extensions:
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# With "./preview.sh build" (strict mode) every one of these warnings fails the build.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

