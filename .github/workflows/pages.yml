# Builds the site and publishes it to GitHub Pages on every push to main.
# The notes explain this file line by line in docs/cicd/github-actions-basics.md.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:        # also allow a manual run from the Actions tab

# The token this workflow gets: read the repo, publish to Pages, and prove its identity to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Read the Pages settings
        uses: actions/configure-pages@v6

      # The same script and the same pinned image as on the laptop. Strict mode: a warning fails the build.
      - name: Build the site
        run: ./preview.sh build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
